services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiamc_nine
      POSTGRES_USER: aiamc
      POSTGRES_PASSWORD: aiamc_dev
    ports:
      - "5432:5432"
    volumes:
      - aiamc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiamc -d aiamc_nine"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  aiamc_postgres_data:
